name: Refresh and publish filtered PlayAndPatch calendar

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "refresh_calendar.py"
      - "requirements.txt"
      - ".github/workflows/refresh-calendar.yml"
      - "docs/index.html"
      - "tests/**"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: refresh-playandpatch-calendar
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Fetch and filter calendar
        run: python refresh_calendar.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Wait for Pages artifact to become available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            response=$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts")

            if echo "$response" | jq -e '.artifacts[]? | select(.name == "github-pages" and .expired == false)' >/dev/null; then
              echo "GitHub Pages artifact is available."
              exit 0
            fi

            echo "Pages artifact is not visible yet (attempt $attempt/12). Retrying in 5 seconds..."
            sleep 5
          done

          echo "::error::GitHub did not make the github-pages artifact available after 60 seconds."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
