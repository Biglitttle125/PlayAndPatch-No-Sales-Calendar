name: Refresh filtered PlayAndPatch calendar

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "refresh_calendar.py"
      - "requirements.txt"
      - ".github/workflows/refresh-calendar.yml"

permissions:
  contents: write

concurrency:
  group: refresh-playandpatch-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and filter calendar
        run: python refresh_calendar.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/calendar.ics
          if git diff --cached --quiet; then
            echo "Calendar has not changed."
          else
            git commit -m "Refresh filtered PlayAndPatch calendar"
            git push
          fi
